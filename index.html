<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision 2026 | Sistema de Monitoreo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        :root {
            --bg-deep: #050507;
            --card-bg: #0f0f13;
            --accent: #3b82f6;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
            padding-bottom: 60px;
        }

        .glass-header {
            background: rgba(5, 5, 7, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .camera-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .camera-card:hover {
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.5);
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            background: #000;
            overflow: hidden;
        }

        .video-container iframe, 
        .video-container video, 
        .video-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            object-fit: cover;
        }

        /* ZOOM ESPECÍFICO PARA PÁGINAS UCN (Elimina marcos y menús molestos) */
        .clean-web-ucn {
            width: 170% !important; 
            height: 170% !important;
            top: -45% !important;   
            left: -35% !important;  
        }

        /* Clase para reproductores directos (sin tanto zoom) */
        .direct-player {
            width: 100% !important;
            height: 100% !important;
            top: 0 !important;
            left: 0 !important;
        }

        .btn-add {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .input-dark {
            background: #16161c;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        .input-dark:focus { border-color: var(--accent); outline: none; }
    </style>
</head>
<body>

    <nav class="glass-header sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tighter text-white">VISION <span class="text-blue-500">2026</span></h1>
                <p class="text-[9px] uppercase tracking-[0.3em] text-slate-500">Panel de Control Coquimbo</p>
            </div>
        </div>

        <button onclick="toggleForm()" class="bg-white/5 hover:bg-white/10 border border-white/10 px-5 py-2.5 rounded-full flex items-center gap-2 transition-all active:scale-95">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span class="text-sm font-semibold text-white">Gestionar</span>
        </button>
    </nav>

    <main class="max-w-[1900px] mx-auto p-4 md:p-8">
        <div id="add-form" class="hidden mb-10 p-8 bg-[#0f0f13] border border-white/5 rounded-3xl animate-in fade-in slide-in-from-top-4 duration-300">
            <h2 class="text-xl font-bold mb-6 text-white">Vincular Nueva Señal</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <input id="cam-name" type="text" placeholder="Nombre (ej: Avenida del Mar)" class="input-dark px-4 py-3 rounded-xl">
                <input id="cam-url" type="text" placeholder="URL de Video o YouTube" class="input-dark px-4 py-3 rounded-xl">
                <button onclick="addCamera()" class="btn-add text-white font-bold py-3.5 rounded-xl">Activar Canal</button>
            </div>
        </div>

        <!-- Grid de 4 columnas en PC -->
        <div id="camera-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- JS Renders here -->
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 bg-[#050507]/90 backdrop-blur-md border-t border-white/5 px-6 py-2 flex items-center justify-between text-[10px] text-slate-600 z-40">
        <div class="flex items-center gap-6">
            <span class="flex items-center gap-2 font-bold"><span class="status-dot"></span> RED SEGURA</span>
            <span id="cam-count">0 FUENTES ACTIVAS</span>
        </div>
        <div id="digital-clock" class="font-mono text-blue-500 font-bold">--:--:--</div>
    </footer>

    <script>
        let cameras = [
            { id: 1, name: "La Serena (YouTube)", url: "https://www.youtube.com/live/eXSFZxNucGI" },
            { id: 2, name: "Coquimbo (YouTube)", url: "https://www.youtube.com/live/JkU7YE5OFOI" },
            { id: 3, name: "UCN Cam Directa 1", url: "https://ucncamcq.ucn.cl:8181/f537af01-e143-49b9-901a-6e6b67be9073.html" },
            { id: 4, name: "UCN Cam Directa 2", url: "https://ucncamcq.ucn.cl:8181/31334bb8-688e-4931-9024-503a2e88a7b3.html" },
            { id: 5, name: "Muelle Coquimbo (Principal)", url: "https://cammuelle.ucn.cl/" },
            { id: 6, name: "Webcam Hotel (Tiempo3)", url: "https://www.tiempo3.com/south-america/chile/coquimbo/la-serena?page=webcam" },
            { id: 7, name: "Skyline Live Serena", url: "https://www.skylinewebcams.com/es/webcam/chile/coquimbo/la-serena.html" },
            { id: 8, name: "Aeródromo La Serena", url: "https://www.outdooractive.com/mobile/en/webcams/la-serena/webcams-in-la-serena/227986689/" },
            { id: 9, name: "La Serena - Coquimbo (Panorámica)", url: "https://es.worldcam.eu/webcams/south-america/chile/26224-coquimbo-la-serena" }
        ];

        function toggleForm() {
            document.getElementById('add-form').classList.toggle('hidden');
        }

        function getEmbedContent(url) {
            // YouTube Handler
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = '';
                if (url.includes('live/')) videoId = url.split('live/')[1].split('?')[0];
                else if (url.includes('v=')) videoId = url.split('v=')[1].split('&')[0];
                else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1].split('?')[0];
                return `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1" allowfullscreen></iframe>`;
            }
            
            // MJPEG / Direct Image Handler
            if (url.match(/\.(jpeg|jpg|gif|png|mjpg|mjpeg)/i)) {
                return `<img src="${url}" alt="stream">`;
            }

            // UCN Filter Handler
            // Si es la página principal aplicamos zoom, si es el .html directo aplicamos vista completa
            const isMainUCN = url.includes('cammuelle.ucn.cl');
            const isDirectUCN = url.includes('ucncamcq.ucn.cl');
            
            let extraClass = '';
            if (isMainUCN) extraClass = 'clean-web-ucn';
            if (isDirectUCN) extraClass = 'direct-player';

            return `<iframe src="${url}" class="${extraClass}" scrolling="no" loading="lazy"></iframe>`;
        }

        function renderCameras() {
            const grid = document.getElementById('camera-grid');
            grid.innerHTML = '';
            document.getElementById('cam-count').innerText = `${cameras.length} FUENTES ACTIVAS`;

            cameras.forEach(cam => {
                const card = document.createElement('div');
                card.className = 'camera-card rounded-3xl overflow-hidden group shadow-2xl';
                
                card.innerHTML = `
                    <div class="video-container">
                        ${getEmbedContent(cam.url)}
                        <div class="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="removeCamera(${cam.id})" class="p-2 bg-black/80 backdrop-blur-md text-red-500 rounded-xl border border-white/10 hover:bg-red-500/20">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>
                        <div class="absolute top-3 left-3 px-2 py-1 bg-blue-600 rounded text-[8px] font-bold text-white uppercase tracking-widest">
                            Live
                        </div>
                    </div>
                    <div class="p-4 bg-[#121218]">
                        <div class="flex items-center justify-between">
                            <h3 class="text-xs font-bold text-gray-300 truncate">${cam.name}</h3>
                            <a href="${cam.url}" target="_blank" class="text-gray-600 hover:text-blue-400 transition-all">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline></svg>
                            </a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function addCamera() {
            const name = document.getElementById('cam-name').value;
            const url = document.getElementById('cam-url').value;
            if (!url) return;
            cameras.push({ id: Date.now(), name: name || "Nueva Cámara", url: url });
            renderCameras();
            toggleForm();
        }

        function removeCamera(id) {
            cameras = cameras.filter(c => c.id !== id);
            renderCameras();
        }

        setInterval(() => {
            document.getElementById('digital-clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        renderCameras();
    </script>
</body>
</html>
